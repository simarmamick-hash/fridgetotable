<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FridgeToTable</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
    <header>
        <h1>FridgeToTable</h1>
        <p>Turn what's in your fridge into a delicious meal.</p>
    </header>

    <main>
        <section class="input-section">
            <label for="ingredients">Enter your ingredients (comma separated):</label>
            <input type="text" id="ingredients" placeholder="e.g., tomato, cheese, bread">
            <button id="generate-btn">Generate Recipes</button>
        </section>

        <section id="recipe-results" class="results-section">
            <!-- Recipes will be injected here dynamically -->
        </section>
    </main>

    <!-- Load our core logic as an ES Module -->
    <script type="module" src="./src/features/recipeGenerator.js"></script>

    <script>
        // Register Service Worker for PWA offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered! Scope:', reg.scope))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
